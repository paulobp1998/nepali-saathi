<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e131b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nepali Saathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Mukta:wght@400;600&display=swap">
<style>
/* Layout: one calm column like a phrasebook page; prayer-flag strings mark progress. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --sunk: #e3e8ef; --ink: #182030; --muted: #586477; --line: #d3d9e2;
  --accent: #c76a12; --accent-soft: #fbe7d2; --on-accent: #ffffff;
  --good: #23784a; --good-soft: #dcf0e4; --bad: #b3261e; --bad-soft: #f8dedb;
  --f-blue: #2b5fa8; --f-white: #f6f6f1; --f-red: #c8352b; --f-green: #2f8a4c; --f-yellow: #e2ae17;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --deva: "Mukta", "Kohinoor Devanagari", "Noto Sans Devanagari", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131b; --surface: #161d28; --sunk: #1d2633; --ink: #e7ebf1; --muted: #9aa5b6; --line: #2a3444;
  --accent: #f0a050; --accent-soft: #3a2a18; --on-accent: #1a1006;
  --good: #5cc488; --good-soft: #15301f; --bad: #f2867c; --bad-soft: #3a1b18;
  --f-white: #dcdcd3; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #161d28; --sunk: #1d2633; --ink: #e7ebf1; --muted: #9aa5b6; --line: #2a3444;
  --accent: #f0a050; --accent-soft: #3a2a18; --on-accent: #1a1006;
  --good: #5cc488; --good-soft: #15301f; --bad: #f2867c; --bad-soft: #3a1b18;
  --f-white: #dcdcd3; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.deva { font-family: var(--deva); }
.muted { color: var(--muted); }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 700; }

.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; white-space: nowrap; }
@media (max-width: 420px) { .brand span { display: none; } .top-in { gap: 8px; } .chip { padding: 4px 8px; font-size: 0.8rem; } }
.brand span { font-family: var(--deva); color: var(--accent); font-weight: 600; }
.top .grow { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 0.85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ring { --p: 0; width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--sunk) 0); display: inline-grid; place-items: center; }
.ring::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); }
.iconbtn { background: none; border: 0; padding: 6px; border-radius: 8px; color: var(--muted); display: inline-grid; place-items: center; }
.iconbtn:hover { color: var(--ink); background: var(--sunk); }
.iconbtn svg { width: 22px; height: 22px; }

main { max-width: 760px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); display: grid; gap: 28px; }
section { display: grid; gap: 12px; min-width: 0; }
.back { justify-self: start; background: none; border: 0; padding: 4px 0; color: var(--muted); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 12px 18px; font-weight: 700; border: 1.5px solid var(--line); background: var(--surface); min-height: 48px; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 0.92rem; border-radius: 10px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn svg { width: 20px; height: 20px; flex: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.row.split { justify-content: space-between; }

/* Home */
.today { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.today .stat { text-align: right; font-variant-numeric: tabular-nums; }
.today .stat b { font-family: var(--display); font-size: 1.6rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 6px; text-align: left; align-content: start; min-width: 0; }
button.card:hover { border-color: var(--accent); }
.card .k { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.card h3 { font-size: 1.15rem; }
.card.lead { background: var(--accent-soft); border-color: transparent; }
.card.lead .k { color: var(--accent); }

.units { display: grid; border-top: 1px solid var(--line); }
.unit-row { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 12px; align-items: center; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.unit-row:hover { background: var(--surface); }
.unit-row .num { font-family: var(--display); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit-row .t { font-weight: 700; }
.unit-row .s { font-size: 0.88rem; color: var(--muted); }

/* Prayer flags: a string with five flags, lit as skills are earned */
.flags { position: relative; display: inline-flex; gap: 4px; padding-top: 4px; }
.flags::before { content: ""; position: absolute; left: -3px; right: -3px; top: 3px; height: 1.5px; background: var(--muted); opacity: 0.5; border-radius: 2px; }
.flag { width: 12px; height: 15px; border: 1.5px dashed color-mix(in srgb, var(--muted) 55%, transparent); border-top: 0; border-radius: 0 0 2px 2px; transform-origin: top center; }
.flag:nth-child(odd) { transform: rotate(-3deg); }
.flag:nth-child(even) { transform: rotate(3deg); }
.flag.on { border: 0; }
.flag.on.c0 { background: var(--f-blue); }
.flag.on.c1 { background: var(--f-white); box-shadow: inset 0 0 0 1px var(--line); }
.flag.on.c2 { background: var(--f-red); }
.flag.on.c3 { background: var(--f-green); }
.flag.on.c4 { background: var(--f-yellow); }
.flags.big .flag { width: 22px; height: 28px; }
.flags.big { gap: 8px; }
.legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; font-size: 0.75rem; color: var(--muted); }
.legend span.on { color: var(--ink); font-weight: 700; }

.list { display: grid; border-top: 1px solid var(--line); }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
button.li:hover { background: var(--surface); }
.li .ro { font-weight: 700; }
.li .en { font-size: 0.9rem; color: var(--muted); }
.li .ne { font-family: var(--deva); font-size: 0.95rem; color: var(--muted); }
.play-dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--ink); border: 0; flex: none; }
.play-dot svg { width: 18px; height: 18px; }
.tick { color: var(--good); font-weight: 700; font-size: 0.85rem; }

.tips { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 8px; }
.tips ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 6px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

/* Practice screens */
.progress { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(18px, 4vw, 32px); display: grid; gap: 18px; justify-items: center; text-align: center; min-width: 0; }
.big-ro { font-family: var(--display); font-size: clamp(1.7rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; overflow-wrap: anywhere; }
.big-ne { font-family: var(--deva); font-size: clamp(1.3rem, 4.5vw, 1.8rem); color: var(--muted); }
.big-en { font-size: 1.15rem; }
.note { font-size: 0.92rem; color: var(--muted); max-width: 46ch; }
.prompt { font-family: var(--display); font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 700; }
.q { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.hear { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent); }
.hear svg { width: 42px; height: 42px; }
.hear.mic { background: var(--ink); color: var(--bg); box-shadow: none; }
.hear.listening { animation: pulse 1.1s ease-in-out infinite; background: var(--bad); color: #fff; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 45%, transparent); } 50% { box-shadow: 0 0 0 16px transparent; } }
@media (prefers-reduced-motion: reduce) { .hear.listening { animation: none; } .progress i { transition: none; } }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 100%; }
.opt { padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); text-align: left; font-weight: 700; min-height: 54px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { background: var(--good-soft); border-color: var(--good); color: var(--ink); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.reveal { display: grid; gap: 4px; justify-items: center; padding: 14px; border-radius: 14px; background: var(--sunk); width: 100%; }
.verdict { font-family: var(--display); font-weight: 800; font-size: 1.3rem; }
.verdict.good { color: var(--good); } .verdict.ok { color: var(--accent); } .verdict.bad { color: var(--bad); }
.meter { width: min(320px, 100%); height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; }
.heard { font-size: 0.95rem; color: var(--muted); }
.banner { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 0.92rem; text-align: left; }
.blur { filter: blur(6px); user-select: none; }

/* Dialogues */
.chat { display: grid; gap: 10px; }
.bubble { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; max-width: 86%; padding: 10px 14px 10px 10px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; }
.bubble.me { justify-self: end; background: var(--accent-soft); border-color: transparent; }
.bubble.now { border-color: var(--accent); }
.bubble .who { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.bubble .ro { font-weight: 700; }
.bubble .en { font-size: 0.9rem; color: var(--muted); }
.bubble .ne { font-family: var(--deva); color: var(--muted); }
.dots { letter-spacing: 0.3em; color: var(--muted); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.tog { padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 0.9rem; font-weight: 700; }
.tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Settings */
.field { display: grid; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.field label { font-weight: 700; }
.field .muted { font-size: 0.9rem; }
select, input[type=range] { font: inherit; max-width: 100%; }
select { padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
input[type=range] { accent-color: var(--accent); width: min(320px, 100%); }
.inp { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.inp.deva { font-family: var(--deva); font-size: 1.1rem; }
.switch { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.status { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 0.92rem; }
.status .ok { color: var(--good); font-weight: 700; } .status .no { color: var(--bad); font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" data-go="home" aria-label="Home"><b>Nepali Saathi</b><span>साथी</span></button>
  <div class="grow"></div>
  <span class="chip" id="streak" title="Days in a row"></span>
  <span class="chip" id="xp" title="Today's goal"><i class="ring" id="ring"></i><span id="xpn"></span></span>
  <button class="iconbtn" data-go="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>
<main id="app" aria-live="polite"></main>
<script src="content.js"></script>
<script src="content-more.js"></script>
<script src="audio-list.js"></script>
<script src="app.js"></script>
</body>
</html>
